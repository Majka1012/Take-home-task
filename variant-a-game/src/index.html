<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Main view</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
      }

      #ad {
        position: absolute;
        width: 360px;
        height: 640px;
        overflow: hidden;
        cursor: pointer;
      }
      #ad img {
        position: absolute;
      }
      :where(#ad img) {
        left: 0;
        top: 0;
      }

      #gesture {
        /* width: 86.5px; */
        left: 146px;
        top: 452px;
      }
      #game {
        /* After adding design on top it didn't align to layout thats why I left: -2px */
        left: -2px;
        clip-path: inset(175px 0 0 0);
      }
      #bg_texture {
        /* height: 640px; */
        left: 10.5px;
        top: 78.5px;
      }
      #player {
        left: 55px;
        top: 258px;
      }
      #bac2 {
        left: 275px;
        top: 328px;
        rotate: 6deg;
        scale: 95%;
      }
      #bac6 {
        left: 85px;
        top: 322px;
        scale: 70%;
      }
      #txt1 {
        left: 100px;
        top: 370px;
        scale: 95%;
      }
      #txt2 {
        left: 301px;
        top: 388px;
        scale: 95%;
      }
      #gesture:hover {
        transform: scale(110%);
      }

      .wall-line {
        position: absolute;
        left: 0;
        width: 100%;
        height: 2px;
        background: red;
        z-index: 50;
      }
      #topLine {
        top: 200px;
      }
      #bottomLine {
        top: 600px;
      }
    </style>
  </head>
  <body>
    <!-- <img src="../design/01-start.png" style="position: absolute; width: 360px; top: 0; z-index: 10; opacity: 0.5" /> -->
    <div id="ad">
      <!-- I started with src and manually added width or height but then I found out about srcset.
       It's eassier and more practical. -->

      <!-- Background -->
      <img id="bg" src="../assets/bg.jpg" srcset="../assets/bg.jpg 2x" />
      <img id="bg_texture" src="../assets/01_game/bg_texture.png" srcset="../assets/01_game/bg_texture.png 2x" />

      <!-- Top -->
      <img id="tut" src="../assets/01_game/tut.png" srcset="../assets/01_game/tut.png 2x" />
      <img id="logo" src="../assets/logo.png" srcset="../assets/logo.png 2x" />

      <!-- Game -->
      <img id="game" src="../assets/01_game/gameplay.png" srcset="../assets/01_game/gameplay.png 2x" />
      <img id="border" src="../assets/border.png" srcset="../assets/border.png 2x" />
      <img id="gesture" class="intro" src="../assets/gesture.png" srcset="../assets/gesture.png 2x" />

      <!-- Player and obstacles -->
      <img id="player" src="../assets/01_game/player.png" srcset="../assets/01_game/player.png 2x" />
      <img id="bac2" class="intro" src="../assets/01_game/bac2.png" srcset="../assets/01_game/bac2.png 2x" />
      <img id="bac6" class="intro" src="../assets/01_game/bac6.png" srcset="../assets/01_game/bac6.png 2x" />
      <img id="txt1" class="intro" src="../assets/01_game/txt1.png" srcset="../assets/01_game/txt1.png 2x" />
      <img id="txt2" class="intro" src="../assets/01_game/txt2.png" srcset="../assets/01_game/txt2.png 2x" />

      <div id="bottomLine" class="wall-line"></div>
      <div id="topLine" class="wall-line"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      const player = document.getElementById("player");

      let started = false;
      let y = 0; // distance from the start position (positive = down)
      let speed = 0; // current vertical speed (positive = down, negative = up)

      //Player is 42x41 so bottom of the bottom hitbox is 258+41
      const startTopY = 258;
      const startBottomY = 299;

      const bottomLine = 600;
      const topLine = 200;

      const gravity = 0.1;
      function loop() {
        speed = speed + gravity;
        y = y + speed;
        if (startBottomY + y > bottomLine || startTopY + y < topLine) {
          return;
        }

        player.style.transform = `translateY(${y}px)`;
        requestAnimationFrame(loop);
      }

      document.addEventListener("pointerdown", function () {
        if (!started) {
          started = true;
          gsap.to(".intro", { autoAlpha: 0, duration: 0.4, ease: "power1.out" });
          gsap.to("#game", { x: -2168, duration: 50, ease: "none" });
          loop();
        } else {
          speed = -4;
        }
      });
    </script>
  </body>
</html>
