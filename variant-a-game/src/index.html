<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Main view</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Design layout with opacity 0.5 -->
    <!-- <img src="../design/01-start.png" style="position: absolute; width: 360px; top: 0; z-index: 10; opacity: 0.5" /> -->
    <!-- <img
      src="../design/02-fail-endcard.png"
      style="position: absolute; width: 360px; top: 0; z-index: 10; opacity: 0.5" /> -->

    <!-- Start view and game assets -->
    <div id="ad">
      <!-- Background -->
      <img id="bg" src="../assets/bg.jpg" />
      <img id="bg_texture" src="../assets/01_game/bg_texture.png" />

      <!-- Top -->
      <img id="tut" src="../assets/01_game/tut.png" />
      <img id="logo" src="../assets/logo.png" />

      <!-- Game -->
      <img id="game" src="../assets/01_game/gameplay.png" />
      <img id="border" src="../assets/border.png" />
      <img id="gesture" class="intro" src="../assets/gesture.png" />

      <!-- Player and obstacles -->
      <img id="player" src="../assets/01_game/player.png" />

      <img id="bac2" class="intro" src="../assets/01_game/bac2.png" />
      <img id="bac6" class="intro" src="../assets/01_game/bac6.png" />

      <img id="txt1" class="intro" src="../assets/01_game/txt1.png" />
      <img id="txt2" class="intro" src="../assets/01_game/txt2.png" />

      <!-- TEMPORARY HITBOX (delete after testing) -->
      <!-- <div id="bottomLine" class="wall-line"></div>
      <div id="topLine" class="wall-line"></div> -->
    </div>

    <!-- Fail view -->
    <div id="fail" class="endcard">
      <img src="../assets/02_endcard/fail/bubble.png" alt="" />
      <img src="../assets/02_endcard/fail/bac1.png" alt="" />
      <img src="../assets/02_endcard/fail/bac2.png" alt="" />
      <img src="../assets/02_endcard/fail/bac3.png" alt="" />
      <img src="../assets/02_endcard/fail/bac4.png" alt="" />
      <img src="../assets/02_endcard/fail/bac5.png" alt="" />
      <img src="../assets/02_endcard/fail/hl.png" id="failText" alt="" />
      <img src="../assets/02_endcard/fail/sad.png" alt="" />
      <img src="../assets/02_endcard/fail/cta.png" id="failCta" alt="" />
      <img src="../assets/02_endcard/fail/replay.png" id="replay" alt="" />
    </div>

    <!-- Win view -->
    <div id="win" class="endcard">
      <img src="../assets/02_endcard/win/bubble.png" alt="" />
      <img src="../assets/02_endcard/win/happy.png" alt="" />
      <img src="../assets/02_endcard/win/hl.png" id="winText" alt="" />
      <img src="../assets/02_endcard/win/konfetti.png" alt="" />
      <img src="../assets/02_endcard/win/cta.png" alt="" id="winCta" />
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
