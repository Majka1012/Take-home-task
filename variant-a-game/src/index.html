<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Main view</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
      }

      #ad {
        position: absolute;
        width: 360px;
        height: 640px;
        overflow: hidden;
        cursor: pointer;
      }
      #ad img {
        position: absolute;
        left: 0;
        top: 0;
      }
      #bg,
      #logo,
      #border,
      #tut {
        width: 360px;
        height: 640px;
      }
      #gesture {
        width: 86.5px;
        right: 0;
        bottom: 0;
        margin: auto;
        margin-top: 125%;
      }
      #game {
        height: 640px;
        top: auto;
        bottom: 0;
        clip-path: inset(175px 0 0 0);
      }
      #bg_texture {
        top: auto;

        bottom: 0px;
      }
    </style>
  </head>
  <body>
    <div id="ad">
      <img id="bg_texture" src="../assets/bg.jpg" />
      <img id="bg" src="../assets/01_game/bg_texture.png" />
      <img id="tut" src="../assets/01_game/tut.png" />
      <img id="game" src="../assets/01_game/gameplay.png" />
      <img id="logo" src="../assets/logo.png" />
      <img id="border" src="../assets/border.png" />
      <img id="gesture" src="../assets/gesture.png" />
    </div>

    <script></script>
  </body>
</html>
