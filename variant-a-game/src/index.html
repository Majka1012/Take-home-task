<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Main view</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Design layout with opacity 0.5 -->
    <!-- <img src="../design/01-start.webp" style="position: absolute; width: 360px; top: 0; z-index: 10; opacity: 0.5" /> -->
    <!-- <img
      src="../design/02-fail-endcard.webp"
      style="position: absolute; width: 360px; top: 0; z-index: 10; opacity: 0.5" /> -->

    <!-- Start view and game assets -->
    <div id="ad">
      <!-- Background -->
      <img id="bg" src="../assets/bg.webp" />
      <img id="bg_texture" src="../assets/01_game/bg_texture.webp" />

      <!-- Top -->
      <img id="tut" src="../assets/01_game/tut.webp" />
      <img id="logo" src="../assets/logo.webp" />

      <!-- Game -->
      <img id="game" src="../assets/01_game/gameplay.webp" />
      <img id="border" src="../assets/border.webp" />
      <img id="gesture" class="intro" src="../assets/gesture.webp" />

      <!-- Player and obstacles -->
      <img id="player" src="../assets/01_game/player.webp" />

      <img id="bac2" class="intro" src="../assets/01_game/bac2.webp" />
      <img id="bac6" class="intro" src="../assets/01_game/bac6.webp" />

      <img id="txt1" class="intro" src="../assets/01_game/txt1.webp" />
      <img id="txt2" class="intro" src="../assets/01_game/txt2.webp" />

      <!-- TEMPORARY HITBOX (delete after testing)  -->
      <!-- <div id="bottomLine" class="wall-line"></div>
      <div id="topLine" class="wall-line"></div> -->
    </div>

    <!-- Fail view -->
    <div id="fail" class="endcard">
      <img src="../assets/02_endcard/fail/bubble.webp" alt="" />
      <img src="../assets/02_endcard/fail/bac1.webp" alt="" />
      <img src="../assets/02_endcard/fail/bac2.webp" alt="" />
      <img src="../assets/02_endcard/fail/bac3.webp" alt="" />
      <img src="../assets/02_endcard/fail/bac4.webp" alt="" />
      <img src="../assets/02_endcard/fail/bac5.webp" alt="" />
      <img src="../assets/02_endcard/fail/hl.webp" id="failText" alt="" />
      <img src="../assets/02_endcard/fail/sad.webp" alt="" />
      <img src="../assets/02_endcard/fail/cta.webp" id="failCta" alt="" />
      <img src="../assets/02_endcard/fail/replay.webp" id="replay" alt="" />
    </div>

    <!-- Win view -->
    <div id="win" class="endcard">
      <img src="../assets/02_endcard/win/bubble.webp" alt="" />
      <img src="../assets/02_endcard/win/happy.webp" alt="" />
      <img src="../assets/02_endcard/win/hl.webp" id="winText" alt="" />
      <img src="../assets/02_endcard/win/konfetti.webp" alt="" />
      <img src="../assets/02_endcard/win/cta.webp" alt="" id="winCta" />
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
  </body>
</html>
