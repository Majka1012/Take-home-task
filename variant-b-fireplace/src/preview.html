<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>preview</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #wrap {
        display: grid;
        grid-template-columns: 320px 1032px 320px;
        grid-template-rows: 250px 725px;
        width: 1672px;
      }
      iframe {
        border: 0;
        display: block;
      }
      #left {
        grid-column: 1;
        grid-row: 1 / 3;
      }
      #top {
        grid-column: 2;
        grid-row: 1;
      }
      #site {
        grid-column: 2;
        grid-row: 2;
        background: #fff;
      }
      #right {
        grid-column: 3;
        grid-row: 1 / 3;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <iframe id="left" src="left.html" width="320" height="975"></iframe>
      <iframe id="top" src="top.html" width="1032" height="250"></iframe>
      <div id="site"></div>
      <iframe id="right" src="right.html" width="320" height="975"></iframe>
    </div>
  </body>
</html>
