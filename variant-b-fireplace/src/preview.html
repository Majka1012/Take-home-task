<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>preview</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #wrap {
        display: grid;
        grid-template-columns: 320px 1032px 320px;
        grid-template-rows: 250px 725px;
        width: 1672px;
      }
      iframe {
        border: 0;
        display: block;
      }
      #left {
        grid-column: 1;
        grid-row: 1 / 3;
      }
      #top {
        grid-column: 2;
        grid-row: 1;
      }
      #site {
        grid-column: 2;
        grid-row: 2;
        background: #fff;
      }
      #right {
        grid-column: 3;
        grid-row: 1 / 3;
      }
    </style>
  </head>
