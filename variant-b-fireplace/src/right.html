<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>right</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #ad {
        position: relative;
        width: 320px;
        height: 975px;
        overflow: hidden;
        cursor: pointer;
      }
      #ad img {
        position: absolute;
      }
      #bg {
        right: 0px;
        top: 0;

        width: 1672px;
      }

      #logo,
      #hl,
      #box {
        left: 0;
        top: 0;
        width: 320px;
      }
      #hl,
      #box {
        mix-blend-mode: screen;
      }

      #cta {
        top: 825px;
        left: 72px;
        width: 160px;

        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="ad">
      <img id="bg" src="../assets/bg-big.jpg" />
      <img id="logo" src="../assets/right/logo.png" />
      <img id="hl" src="../assets/right/hl.png" />
      <img id="box" src="../assets/box.png" />
      <img id="cta" src="../assets/cta.png" />
    </div>
  </body>
</html>
