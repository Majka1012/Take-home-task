<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>right</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #ad {
        position: relative;
        width: 320px;
        height: 975px;
        overflow: hidden;
        cursor: pointer;
      }
      #ad img {
        position: absolute;
      }
      #bg {
        right: 0px;
        top: 0;

        width: 1672px;
      }

      #logo,
      #hl,
      #box {
        left: 0;
        top: 0;
        width: 320px;
      }
      #hl,
      #box {
        mix-blend-mode: screen;
      }

      #cta {
        top: 825px;
        left: 72px;
        width: 160px;

        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="ad">
      <img id="bg" src="../assets/bg-big.jpg" />
      <img id="logo" src="../assets/right/logo.png" />
      <img id="hl" src="../assets/right/hl.png" />
      <img id="box" src="../assets/box.png" />
      <img id="cta" src="../assets/cta.png" />
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      const clickTag = window.clickTag || "https://example.com/landing";
      document.getElementById("ad").onclick = () => window.open(clickTag, "_blank");

      gsap.from("#bg", { scale: 1.1, duration: 4, ease: "slow.out" });

      const tl = gsap.timeline();
      tl.from("#logo", { opacity: 0, scale: 0.8, duration: 0.8, ease: "back.out(1.7)" }, 0.3)
        .from("#hl", { opacity: 0, x: 150, duration: 1.2, ease: "power3.out" }, 0.8)
        .from("#box", { opacity: 0, y: 30, duration: 0.8, ease: "power2.out" }, 2)
        .from("#cta", { opacity: 0, scale: 0.7, duration: 0.8, ease: "back.out(1.7)" }, 3.5);

      gsap.to("#cta", { scale: 1.05, duration: 0.9, yoyo: true, repeat: 27, ease: "sine.inOut", delay: 5.7 }); //0.9*27+5.7=30sek
    </script>
  </body>
</html>
